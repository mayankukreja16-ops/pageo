<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pageo — 100% Digital Art, Colouring E-Books & Publishing Assets</title>
    <meta name="description" content="Instant access to 300 DPI print-ready colouring e-books, Procreate brushes, illustrated storybooks, calligraphy guides, and Amazon KDP publishing assets." />
    <meta property="og:title" content="Pageo — 100% Digital Art, Colouring E-Books & Publishing Assets" />
    <meta property="og:description" content="Instant access to 300 DPI print-ready colouring e-books, Procreate brushes, illustrated storybooks, calligraphy guides, and Amazon KDP publishing assets." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <script>
      (function() {
        function shouldIgnore(msg, source) {
          var str = String(msg || '');
          var src = String(source || '');
          return (
            str.indexOf('chrome: call method') !== -1 ||
            str.indexOf('chrome-extension://') !== -1 ||
            str.indexOf('Window message') !== -1 ||
            str.indexOf('timed out') !== -1 ||
            src.indexOf('chrome-extension://') !== -1
          );
        }

        window.addEventListener('error', function(e) {
          if (shouldIgnore(e.message, e.filename) || (e.error && shouldIgnore(e.error.message, e.error.stack))) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          var msg = reason ? (reason.message || reason.stack || String(reason)) : '';
          if (shouldIgnore(msg, reason && reason.stack)) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('message', function(event) {
          try {
            if (event.data && typeof event.data === 'object') {
              if (event.data.type === 'chrome: call method' || event.data.action === 'chrome: call method') {
                if (event.source && typeof event.source.postMessage === 'function') {
                  event.source.postMessage({
                    id: event.data.id || event.data.callId,
                    response: 'ok',
                    success: true,
                    result: null
                  }, '*');
                }
              }
            }
          } catch (err) {}
        }, false);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
